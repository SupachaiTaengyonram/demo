function wireAdmin(){document.querySelectorAll("[data-admin]").forEach(b=>b.onclick=()=>setAdmin(b.dataset.admin));document.querySelectorAll("[data-perm],#adduser").forEach(b=>b.onclick=perm);document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>setAdmin("edit"));let al=document.getElementById("addlisting");if(al)al.onclick=()=>setAdmin("add");document.querySelectorAll("[data-toast]").forEach(b=>b.onclick=()=>say(b.dataset.toast));let lf=document.getElementById("listingform");if(lf)lf.onsubmit=e=>{e.preventDefault();say("Listing published");setAdmin("listings")};let d=document.getElementById("draft");if(d)d.onclick=()=>say("Draft saved");let c=document.getElementById("cancel");if(c)c.onclick=()=>setAdmin("listings");let dz=document.getElementById("dropzone");if(dz){dz.onclick=()=>say("Photo picker opened");dz.ondragover=e=>{e.preventDefault();dz.classList.add("drag")};dz.ondragleave=()=>dz.classList.remove("drag");dz.ondrop=e=>{e.preventDefault();dz.classList.remove("drag");say("Photos added")}}}
document.getElementById("hamb").onclick=()=>nav.classList.toggle("open");document.getElementById("reg").onclick=()=>auth("Register");document.getElementById("lang").onclick=()=>say("Language switched");document.getElementById("logout").onclick=()=>{say("Logged out");go("home")};document.getElementById("bell").onclick=()=>say("3 admin notifications");mb.onclick=e=>{if(e.target==mb)closeModal()};document.onkeydown=e=>{if(e.key=="Escape")closeModal()};document.body.onclick=e=>{let m=e.target.closest("[data-menu]");document.querySelectorAll(".drop").forEach(d=>d.classList.remove("open"));if(m)m.closest(".drop").classList.toggle("open")};let adminBtn=document.createElement("button");adminBtn.className="btn gold";adminBtn.style.cssText="position:fixed;right:18px;bottom:18px;z-index:60";adminBtn.textContent="Admin";adminBtn.onclick=()=>setAdmin("dashboard");document.body.appendChild(adminBtn);render();
</script>
</body>
